### controller config file ###
controller:
  ros__parameters:
    angle_pitch_integration_limit: 1.0 #俯仰角度积分限幅
    rate_pitch_integration_limit: 1.0 #俯仰角速率积分限幅 
    rate_yaw_integration_limit: 1.0 #艏向角速率积分限幅  
    vel_x_integration_limit: 1.0 #

    angle_pitch_output_limit: 1.0 #滚转角度PID输出限幅
    rate_pitch_output_limit: 1.0 #俯仰角速度PID输出限幅
    rate_yaw_output_limit: 1.0 #艏向角速度PID输出限幅 
    vel_x_output_limit: 1.0 
         
    dt: 0.05 #控制周期0.05S(20HZ)，非必要不修改

    angle_pitch_pid_P: 0.01 #pitch P
    angle_pitch_pid_I: 0.01 #pitch I
    angle_pitch_pid_D: 0.0 #pitch D        
    rate_pitch_pid_P: 1.0 #pitch rate P
    rate_pitch_pid_I: 0.0 #pitch rate I
    rate_pitch_pid_D: 0.0 #pitch rate D  
    
    rate_yaw_pid_P: 1.0 #航向角速度P
    rate_yaw_pid_I: 0.0 #航向角速度I
    rate_yaw_pid_D: 0.0 #航向角速度D    
    
    vel_x_pid_P: 1.5 #x轴速度P
    vel_x_pid_I: 0.0 #x轴速度I
    vel_x_pid_D: 0.01 #x轴速度D
    # 舵向系数：只做安装镜像补偿，不是横滚差动。
    # 十字舵俯仰/航向是共模：同一轴两路应带出同向舵面；若安装镜像，
    # 软件指令会一正一负（例 pitch→ch0=-45,ch1=+45），实物才同向。
    # 若两路指令同号、实物却一前一后：把「反的那路」dir 取反后再确认。
    gs1_dir: -1   # 水平1（pitch）
    gs2_dir: 1    # 水平2（pitch）
    gs3_dir: 1    # 垂直1（yaw）
    gs4_dir: -1   # 垂直2（yaw）
    # 实艇当前十字舵：水平跟 pitch、垂直跟 yaw；叉型改回 "x"
    gs_mix_layout: "cross"
    gs_mix_x_scale: 0.70710678
    # Task 开始写 CSV，结束/失败关文件；空目录 = $HOME/sealien_auv_ws/logs/pid
    pid_debug_log_enable: true
    pid_debug_log_dir: ""

